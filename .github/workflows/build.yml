name: Build installers

# Builds the Mac (Apple Silicon) and Windows apps.
# - Every push to main: builds both and keeps them as workflow artifacts (Actions tab → run → Artifacts).
# - Pushing a tag like v2.0.1: also attaches the installers to a GitHub Release.
# - Or run it by hand: Actions → Build installers → Run workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            name: mac-arm64
          - os: windows-latest
            script: dist:win
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Check the bundled ffmpeg has caption + audio filters
        shell: bash
        run: |
          FF=$(node -p "require('ffmpeg-static')")
          "$FF" -hide_banner -filters | grep -E " (ass|subtitles|loudnorm|alphamerge) "
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: RoMadeThat-Interview-Studio-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
